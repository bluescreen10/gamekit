name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    # gpu/vulkan requires VK_KHR_unified_image_layouts: its headers arrived in Vulkan
    # 1.4.317 and lavapipe supports it from Mesa 25.3. Ubuntu 24.04 has neither, so the
    # package fails to compile there; 26.04 ships Mesa 26.0 and Vulkan 1.4.341.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
      GAMEKIT_GPU_BACKEND: vulkan
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      XDG_RUNTIME_DIR: /tmp
      # ui/gtk runs on Xvfb, which has no GPU; GTK's default Vulkan/GL renderer then
      # falls back to lavapipe and is flaky. Cairo renders on the CPU and is stable.
      GDK_BACKEND: x11
      GSK_RENDERER: cairo

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # libgtk-4-dev is what ui/gtk compiles against. The conformance suite also
      # exercises GTK's optional media and WebKit backends plus notifications.
      # openbox is a window manager, without which Xvfb ignores maximize, minimize
      # and fullscreen requests.
      - name: Install Mesa Vulkan software renderer and GTK 4 test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            dbus-daemon \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libgtk-4-dev \
            libvulkan-dev \
            libwebkitgtk-6.0-4 \
            libx11-dev \
            mesa-vulkan-drivers \
            notification-daemon \
            openbox \
            vulkan-tools \
            xauth \
            xvfb

      - name: Select lavapipe ICD
        run: |
          lavapipe_icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$lavapipe_icd"
          echo "VK_DRIVER_FILES=$lavapipe_icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$lavapipe_icd" >> "$GITHUB_ENV"

      - name: Verify lavapipe
        run: vulkaninfo --summary

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The no-cgo build compiles the *_unsupported.go stubs, which every real platform
      # excludes by build tag — so nothing else here ever compiles them.
      - name: Build and vet without cgo
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go vet ./...

      # xvfb supplies the X display the window and input code needs; without it every
      # X11 path fails at XOpenDisplay rather than being tested. The private session
      # bus lets the tray register, and notification-daemon provides the service used
      # by the notification conformance checks. No -v: only failures print, so a red
      # run shows why without scrolling past every passing test.
      # -coverpkg=./... credits every package that a test runs, so the conformance
      # suite in ui counts toward ui/gtk and the other backends.
      - name: Test
        run: |
          dbus-run-session -- xvfb-run -a sh -c '
            openbox &
            window_manager=$!
            /usr/lib/notification-daemon/notification-daemon &
            notification_service=$!
            trap "kill $notification_service $window_manager 2>/dev/null || true" EXIT
            sleep 1
            go test ./... -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage-linux.out
          '

      # Codecov merges the reports of the three platforms; the flag shows the coverage
      # of each platform on its own. A failed test run still uploads its report.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-linux.out
          flags: linux

  macos:
    name: macOS
    # The Metal backend uses Metal 4 (MTL4*), which needs the macOS 26 SDK; macos-15
    # ships Xcode 16.4 and fails to compile it. macos-26 is Apple Silicon.
    runs-on: macos-26
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
      # GAMEKIT_GPU_BACKEND is deliberately unset. The runner is a virtual machine whose
      # paravirtualized GPU has no Metal 4, so the Metal backend's Init fails ("requires
      # a Metal 4 GPU"); unset, the GPU tests skip instead of failing, and everything
      # else — windows, input, the backend's Go side — is still tested. GPU tests run
      # on a real Mac. (gpu/vulkan is opt-in on macOS and not built here.)

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Shows which GPU the runner has, so a skipped GPU suite has a visible reason.
      - name: Show GPU
        run: system_profiler SPDisplaysDataType

      # Cocoa needs a WindowServer connection to create a window at all, which the
      # hosted macOS runners have.
      - name: Test
        run: go test ./... -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage-macos.out

      # Codecov merges the reports of the three platforms; the flag shows the coverage
      # of each platform on its own. A failed test run still uploads its report.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-macos.out
          flags: macos

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
      # LunarG patch-releases each platform independently: 1.4.357.1 exists only for
      # macOS, and asking for it here returns a 404 rather than falling back to .0.
      VULKAN_SDK_VERSION: 1.4.357.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # ui/win32 is C++17 built against the Windows headers of llvm-mingw, which the
      # backend is tested with; cgo uses its Clang for C and C++.
      - name: Install llvm-mingw
        shell: pwsh
        run: |
          $release = "20260616"
          $name = "llvm-mingw-$release-ucrt-x86_64"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$release/$name.zip" -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath C:\
          "C:\$name\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "CC=x86_64-w64-mingw32-clang"    | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXX=x86_64-w64-mingw32-clang++" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Fail loudly here rather than inside an opaque cgo build error.
      - name: Verify the C toolchain
        run: |
          x86_64-w64-mingw32-clang --version
          x86_64-w64-mingw32-clang++ --version

      # The install is a 274 MB download, and nothing about it varies between runs of the
      # same SDK version — so cache the finished tree rather than the installer. The key
      # carries the version, so a version bump misses and reinstalls on its own.
      - name: Restore the cached Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-windows-${{ env.VULKAN_SDK_VERSION }}

      # gpu/vulkan is cgo that includes vulkan/vulkan.h and links vulkan-1, so it needs
      # the SDK to COMPILE even though no driver will be present to run it. Without this
      # the whole package fails to build and bridge_windows.c, extensions_windows.go and
      # gpu/vulkan/surface_windows.go — which no other job compiles — go uncovered.
      - name: Install the Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ver = $env:VULKAN_SDK_VERSION
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          Invoke-WebRequest -Uri $url -OutFile vulkansdk.exe
          $p = Start-Process -FilePath .\vulkansdk.exe -Wait -PassThru -ArgumentList `
            "--root", "C:\VulkanSDK", "--accept-licenses", "--default-answer", "--confirm-command", "install"
          if ($p.ExitCode -ne 0) { throw "the Vulkan SDK installer failed with exit code $($p.ExitCode)" }

      # Runs on both paths: a cache hit restores the tree but sets no environment, and it
      # also catches a cache entry that restored damaged or incomplete — which would
      # otherwise surface as a confusing missing-header error inside the cgo build.
      - name: Point cgo at the Vulkan SDK
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\VulkanSDK\Include\vulkan\vulkan.h")) { throw "vulkan.h is missing from the SDK tree" }
          if (-not (Test-Path "C:\VulkanSDK\Lib\vulkan-1.lib"))        { throw "vulkan-1.lib is missing from the SDK tree" }
          # The #cgo windows directive already passes -lvulkan-1; only the search paths
          # are machine-specific.
          "CGO_CFLAGS=-IC:\VulkanSDK\Include"  | Out-File -FilePath $env:GITHUB_ENV -Append
          "CGO_LDFLAGS=-LC:\VulkanSDK\Lib"     | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The SDK supplies headers and an import library, not a driver, so no backend
      # registers and the gpu tests skip themselves. This job compiles the Win32 backend and
      # the Vulkan-surface code, which no other job compiles, and runs the shared
      # ui conformance suite against Win32 in the desktop session of the runner.
      # PowerShell splits an unquoted argument such as -coverprofile=a.out at the dot.
      - name: Test
        run: go test ./... -count=1 "-covermode=atomic" "-coverpkg=./..." "-coverprofile=coverage-windows.out"

      # Codecov merges the reports of the three platforms; the flag shows the coverage
      # of each platform on its own. A failed test run still uploads its report.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-windows.out
          flags: windows
