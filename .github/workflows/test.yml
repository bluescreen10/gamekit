name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    # gpu/vulkan requires VK_KHR_unified_image_layouts: its headers arrived in Vulkan
    # 1.4.317 and lavapipe supports it from Mesa 25.3. Ubuntu 24.04 has neither, so the
    # bridge fails to compile there; 26.04 ships Mesa 26.0 and Vulkan 1.4.341.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
      GAMEKIT_GPU_BACKEND: vulkan
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      XDG_RUNTIME_DIR: /tmp

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Mesa Vulkan software renderer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libvulkan-dev libx11-dev mesa-vulkan-drivers vulkan-tools xauth xvfb

      - name: Select lavapipe ICD
        run: |
          lavapipe_icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$lavapipe_icd"
          echo "VK_DRIVER_FILES=$lavapipe_icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$lavapipe_icd" >> "$GITHUB_ENV"

      - name: Verify lavapipe
        run: vulkaninfo --summary

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The no-cgo build compiles the *_unsupported.go stubs, which every real platform
      # excludes by build tag — so nothing else here ever compiles them.
      - name: Build and vet without cgo
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go vet ./...

      # xvfb supplies the X display the window and input code needs; without it every
      # X11 path fails at XOpenDisplay rather than being tested. No -v: only failures
      # print, so a red run shows why without scrolling past every passing test.
      - name: Test
        run: xvfb-run -a go test ./... -count=1

  macos:
    name: macOS
    # Pinned rather than macos-latest: KosmicKrisp is Apple Silicon only, and a runner
    # image that quietly moved back to x86_64 would fail as if the driver were broken.
    runs-on: macos-15
    # The SDK download is ~376 MB, so this job needs more headroom than the others.
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
      # Metal is the default backend on macOS. Named explicitly so a device that fails
      # to initialise fails the run instead of skipping every GPU test.
      GAMEKIT_GPU_BACKEND: metal
      # Pinned rather than "latest" so a CI failure is always reproducible, and so this
      # matches the SDK used in development.
      VULKAN_SDK_VERSION: 1.4.357.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # gpu/vulkan is opt-in on macOS (-tags gamekit_vulkan). The SDK is installed only
      # to compile it: KosmicKrisp finds no usable GPU on the hosted runners' virtual
      # machines ("Failed to detect any valid GPUs"), so its tests run on a real Mac.
      # com.lunarg.vulkan.usr copies headers and the loader into /usr/local, which is
      # where gpu/vulkan's #cgo darwin flags look.
      - name: Install the Vulkan SDK
        run: |
          ver="$VULKAN_SDK_VERSION"
          curl -sSfL -o vulkansdk.zip \
            "https://sdk.lunarg.com/sdk/download/${ver}/mac/vulkansdk-macos-${ver}.zip"
          unzip -q vulkansdk.zip -d vulkansdk
          # The installer lives inside an .app bundle whose name carries the version;
          # find it rather than hardcoding a path that changes every release.
          installer="$(find vulkansdk -type f -path '*/Contents/MacOS/vulkansdk-macOS-*' -print -quit)"
          test -n "$installer" || { echo "installer not found in the SDK archive"; exit 1; }
          sudo "$installer" \
            --root "$HOME/VulkanSDK/${ver}" \
            --accept-licenses --default-answer --confirm-command \
            install com.lunarg.vulkan.core com.lunarg.vulkan.usr

      - name: Build
        run: |
          go build ./...
          go build -tags gamekit_vulkan ./...

      # unsafeptr is off here, and only here. surface_darwin.go and gpu/vulkan's
      # metal_darwin.go convert a uintptr back to an unsafe.Pointer to hand Cocoa and
      # Vulkan handles (an NSWindow, a CAMetalLayer) across the cgo boundary. Those
      # addresses belong to C, so the GC neither owns nor moves them, but vet's
      # heuristic cannot tell them from laundering a real Go pointer. Every other check
      # still runs, and no other platform compiles these files.
      - name: Vet
        run: |
          go vet -unsafeptr=false ./...
          go vet -unsafeptr=false -tags gamekit_vulkan ./...

      # Cocoa needs a WindowServer connection to create a window at all, which the
      # hosted macOS runners have.
      - name: Test
        run: go test ./... -count=1

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
      # Deliberately NOT the same version as the macOS job. LunarG patch-releases each
      # platform independently: 1.4.357.1 exists only for macOS, and asking for it here
      # returns a 404 rather than falling back to .0.
      VULKAN_SDK_VERSION: 1.4.357.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # cgo needs a C toolchain; the hosted image ships mingw-w64. Fail loudly here
      # rather than inside an opaque cgo build error.
      - name: Verify the C toolchain
        run: gcc --version

      # The install is a 274 MB download, and nothing about it varies between runs of the
      # same SDK version — so cache the finished tree rather than the installer. The key
      # carries the version, so a version bump misses and reinstalls on its own.
      - name: Restore the cached Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-windows-${{ env.VULKAN_SDK_VERSION }}

      # gpu/vulkan is cgo that includes vulkan/vulkan.h and links vulkan-1, so it needs
      # the SDK to COMPILE even though no driver will be present to run it. Without this
      # the whole package fails to build and bridge_windows.c, extensions_windows.go and
      # gpu/vulkan/surface_windows.go — which no other job compiles — go uncovered.
      - name: Install the Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ver = $env:VULKAN_SDK_VERSION
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          Invoke-WebRequest -Uri $url -OutFile vulkansdk.exe
          $p = Start-Process -FilePath .\vulkansdk.exe -Wait -PassThru -ArgumentList `
            "--root", "C:\VulkanSDK", "--accept-licenses", "--default-answer", "--confirm-command", "install"
          if ($p.ExitCode -ne 0) { throw "the Vulkan SDK installer failed with exit code $($p.ExitCode)" }

      # Runs on both paths: a cache hit restores the tree but sets no environment, and it
      # also catches a cache entry that restored damaged or incomplete — which would
      # otherwise surface as a confusing missing-header error inside the cgo build.
      - name: Point cgo at the Vulkan SDK
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\VulkanSDK\Include\vulkan\vulkan.h")) { throw "vulkan.h is missing from the SDK tree" }
          if (-not (Test-Path "C:\VulkanSDK\Lib\vulkan-1.lib"))        { throw "vulkan-1.lib is missing from the SDK tree" }
          # The #cgo windows directive already passes -lvulkan-1; only the search paths
          # are machine-specific.
          "CGO_CFLAGS=-IC:\VulkanSDK\Include"  | Out-File -FilePath $env:GITHUB_ENV -Append
          "CGO_LDFLAGS=-LC:\VulkanSDK\Lib"     | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The SDK supplies headers and an import library, not a driver, so no backend
      # registers and the gpu tests skip themselves. What this job covers is compilation
      # of the Win32 window, input and Vulkan-surface code, which no other job compiles.
      - name: Test
        run: go test ./... -count=1
