# baseURL is set per version by .github/workflows/docs.yml.
baseURL = "http://localhost:1313/"
title = "GameKit"
locale = "en-US"

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

  # The logo lives at the repository root; the site serves it from there rather
  # than keeping a copy.
  [[module.mounts]]
    source = "../logo"
    target = "static/images"

  [[module.mounts]]
    source = "static"
    target = "static"

[markup.goldmark.renderer]
  unsafe = true

[params.navbar]
  displayTitle = false
  displayLogo = true

[params.navbar.logo]
  path = "images/gamekit-logo.svg"
  width = 140
  height = 30

[[menu.main]]
  name = "Docs"
  pageRef = "/docs"
  weight = 1

[[menu.main]]
  name = "API"
  url = "https://pkg.go.dev/github.com/bluescreen10/gamekit"
  weight = 2

[[menu.main]]
  identifier = "version"
  name = "Version"
  weight = 3

[[menu.main]]
  name = "latest"
  parent = "version"
  url = "https://game-kit.dev/latest/"
  weight = 1

[[menu.main]]
  name = "dev"
  parent = "version"
  url = "https://game-kit.dev/dev/"
  weight = 2

[[menu.main]]
  name = "Search"
  weight = 4
  [menu.main.params]
    type = "search"

[[menu.main]]
  name = "GitHub"
  url = "https://github.com/bluescreen10/gamekit"
  weight = 5
  [menu.main.params]
    icon = "github"
